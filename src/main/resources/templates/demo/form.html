<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live form demo - RIFE2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Source+Sans+3:wght@300;400&display=swap">
    <link rel="stylesheet" href="{{v webapp:rootUrl/}}css/style.css?{{v context:paramRandom/}}">
    <script src="{{v webapp:rootUrl/}}js/htmx.min.js?{{v context:paramRandom/}}"></script>
</head>
<body>
<main class="demo">
    <p class="demo-back"><a href="{{v route:.home/}}#forms">Back to RIFE2</a></p>
    <h1>Forms</h1>
    <p>One route and one template handle both the empty form and its result. A GET renders the form, a POST renders the greeting.</p>
    <!--v stage/-->
    <p class="demo-note">Your input is echoed through <code>setValueEncoded</code>, so even HTML or scripts in it are rendered as harmless text.</p>
</main>
</body>
</html>
<!--bv stage-->
    <div class="demo-stage">
        <form class="demo-form" action="{{v run_url/}}" method="post"
              hx-post="{{v run_url/}}" hx-target="next .demo-result" hx-swap="outerHTML">
            <input type="text" name="name" placeholder="Your name (try &lt;b&gt;bold&lt;/b&gt;)">
            <button type="submit">Say hello</button>
        </form>
        <!--v result/-->
    </div>
<!--/bv-->
<!--b result_content--><div class="demo-result"><!--v greeting/--></div><!--/b-->
<!--b greeting_filled--><p class="demo-clock">Hello <!--v name/-->!</p><!--/b-->
